name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v5

      - name: Instalacja Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Sprawdzenie formatowania
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
